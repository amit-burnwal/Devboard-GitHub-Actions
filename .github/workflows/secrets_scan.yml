# Goal:  To scan the security scan 
name: Security SCAN
on:
    workflow_call:

jobs:
   security_scan: 
      runs-on: ubuntu-latest
      steps:
         - name: code checkout
           uses: actions/checkout@v7
           with:
              fetch-depth: 0

         - name: Run gitleaks
           run: gitleaks/gitleaks@v4
           env:
              security_token: ${{secrets.GITHUB_TOKEN}}