# Goal: to setup the code and test the code
name: code

on:
    workflow_call:
   
jobs:
   code_setup_and_test:
      runs-on: ubuntu-latest
      steps:
         - name: Checkout repository code 
           uses: actions/checkout@v7

         - name: Setup Go for backend
           uses: actions/setup-go@v6
           with:
              go-version: '1.23'  # Adjust to your Go version
              go-version-file: backend/go.mod
              cache-dependency-path: backend/go.sum

        # - name: Install dependencies for Go
        #   run: go mod download

         - name: Set up React(Node.js) for frontend
           uses: actions/setup-node@v6
           with:
              node-version: 20
              cache: 'npm'
              cache-dependency-path: frontend/package.json

         - name: Install dependencies for frontend
           run: npm install --legacy-peer-deps
           working-directory: frontend

         - name: Run test for frontend(nodejs)
           run: npm run test
           working-directory: frontend

         - name: Run test for backend (go)
           run: go test
           working-directory: backend
   
    

  