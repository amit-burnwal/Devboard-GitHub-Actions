# Goal - To Run End to End DevSecOps CI Pipeline

name: DevSecOps

on:
    push:
        branches: [main]

jobs:

    ## ---- CI ----
    # Code Stage 
    code-quality:
        uses: ./.github/workflows/code_lint_quality.yml

    # Secret Scanning
    secret-scanning:
        uses: ./.github/workflows/secrets_scan.yml

    # Dependency Checks
    dependency-checks:
        uses: ./.github/workflows/dependency_scan.yml

    # Docker Checks
    docker-checks:
        uses: ./.github/workflows/docker_scan.yml
        secrets: inherit 

    # SonarQube
    sonar-qube:
        uses: ./.github/workflows/sonarquebe_scan.yml
        secrets: inherit

    # Code Tests
    code-tests:
        uses: ./.github/workflows/code_testing.yml

    # push-to-docker-hub:
    docker-push:
        uses: ./.github/workflows/docker_push.yml
        needs: [code-quality,code-tests,sonar-qube,docker-checks,dependency-checks,secret-scanning]
        secrets: inherit

  