# Goal: To check the syntactically error on code and i have to do SAST for my code

name: code_lint_quality

on:
    workflow_call:

jobs:
     code_lint:
         runs-on: ubuntu-latest
         steps:
            - name: code checkout
              uses: actions/checkout@v7

         # ----------------------------
         # FRONTEND
         # ----------------------------

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                 node-version: '20'
                 cache: 'npm'
                 cache-dependency-path: frontend/package-lock.json

            - name: Install Frontend Dependencies
              run: npm install --legacy-peer-deps
              working-directory: frontend

            - name: Run Frontend Linter
              run: npm run lint
              working-directory: frontend
              #continue-on-error: true # Prevents Node failure from blocking the final check
            
              # ------------------------------------
              #  BACKEND
              # ------------------------------------
            
            - name: Setup Go for backend
              uses: actions/setup-go@v6
              with:
                 go-version: '1.23'  # Adjust to your Go version
                 go-version-file: backend/go.mod
                 cache-dependency-path: backend/go.sum

            - name: Run Go Formatter
              run: go fmt
              working-directory: backend

            - name: Run Go Vet
              run: go vet
              working-directory: backend
          
            