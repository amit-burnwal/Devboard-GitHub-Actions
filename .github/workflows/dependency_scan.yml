# Goal: I have to ensure the packages & dependencies have been audited for Security

name: Dependency Scan

on:
    workflow_call:

jobs:
    dependency_scan:
        runs-on: ubuntu-latest
        steps:
           - name: code checkout
             uses: actions/checkout@v7

           
         # ----------------------------
         # FRONTEND
         # ----------------------------

           - name: Setup Node.js
             uses: actions/setup-node@v6
             with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json
            
           
        # Fails the pipeline if HIGH or CRITICAL production vulnerabilities are found
           - name: RUN dependency scan for nodejs
             run: npm audit fix --audit-level=high --omit=dev || true
             working-directory: frontend


           - name: Upload Report to Artifacts
             if: always() # Ensures report uploads even if tests fail
             uses: actions/upload-artifact@v4
             with:
                name: dependency-scan-report
                path: reports/dependency-report.txt
                retention-days: 5


              # ------------------------------------
              #  BACKEND
              # ------------------------------------
            
           - name: Setup Go for backend
             uses: actions/setup-go@v6
             with:
                go-version: 1.22  # Adjust to your Go version
                go-version-file: backend/go.mod
                cache-dependency-path: backend/go.sum

           - name: Install Govulncheck
             # Installs the official tool and runs it against the current module
             run: go install golang.org/x/vuln/cmd/govulncheck@1.1.4

           - name: Run Govulncheck
             run:  govulncheck ./... > govulncheck-report.txt
        # If your Go project is in a subdirectory, uncomment below:
             working-directory: backend
             continue-on-error: true

              